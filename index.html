<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocacia & Consultoria Jurídica</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a1118;
            --bg-secondary: #101923;
            --bg-card: #152232;
            --accent-gold: #c5a059;
            --accent-gold-hover: #dfb76c;
            --text-primary: #f0f4f8;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(197, 160, 89, 0.2);
            --font-heading: 'Cormorant Garamond', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 17, 24, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(10, 17, 24, 0.85), rgba(10, 17, 24, 0.95)),
                        url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            padding: 8rem 2rem 4rem;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-subtitle {
            color: var(--accent-gold);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .hero-description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .btn-gold {
            display: inline-block;
            background: transparent;
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 1rem 2.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-gold:hover {
            background: var(--accent-gold);
            color: var(--bg-primary);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* Sections General */
        section {
            padding: 6rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-title h2 {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .section-title div {
            width: 60px;
            height: 3px;
            background: var(--accent-gold);
            margin: 0 auto;
        }

        /* Areas of Practice */
        .grid-areas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .area-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2.5rem 2rem;
            border-radius: 4px;
            transition: transform 0.3s, border-color 0.3s;
        }

        .area-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .area-icon {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 1.5rem;
        }

        .area-card h3 {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }

        .area-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* About Section */
        .about-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            color: var(--accent-gold);
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        /* Contact Section */
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .contact-info {
            display: flex;
